name: Update LHDN PDFs

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create pdfs directory
        run: mkdir -p pdfs

      - name: Download and check PDFs
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          CHANGED_LIST=""

          download_pdf() {
            local filename="$1"
            local url="$2"

            echo "--- Downloading $filename ---"

            OLD_SHA=""
            if [ -f "pdfs/$filename" ]; then
              OLD_SHA=$(sha256sum "pdfs/$filename" | cut -d' ' -f1)
            fi

            curl -L -A "$UA" \
              -H "Accept: application/pdf,*/*" \
              -H "Accept-Language: en-US,en;q=0.9" \
              --retry 3 --retry-delay 5 \
              -o "pdfs/$filename.new" \
              "$url"

            local SIZE=$(stat -c%s "pdfs/$filename.new")
            local HEADER=$(head -c 5 "pdfs/$filename.new")

            if [ "$SIZE" -lt 100000 ]; then
              echo "  SKIP: only ${SIZE} bytes"
              rm -f "pdfs/$filename.new"
              return
            fi

            if [ "$HEADER" != "%PDF-" ]; then
              echo "  SKIP: not a valid PDF"
              rm -f "pdfs/$filename.new"
              return
            fi

            local NEW_SHA=$(sha256sum "pdfs/$filename.new" | cut -d' ' -f1)
            echo "  Size: ${SIZE} bytes"
            echo "  SHA256: ${NEW_SHA}"

            if [ "$OLD_SHA" = "$NEW_SHA" ]; then
              echo "  UNCHANGED"
              rm -f "pdfs/$filename.new"
            else
              echo "  UPDATED"
              mv "pdfs/$filename.new" "pdfs/$filename"
              CHANGED_LIST="$CHANGED_LIST $filename"
            fi
          }

          download_pdf "IRBM-e-Invoice-Guideline.pdf" \
            "https://www.hasil.gov.my/wp-content/uploads/IRBM-e-Invoice-Guideline.pdf"

          download_pdf "IRBM-e-Invoice-Specific-Guideline.pdf" \
            "https://www.hasil.gov.my/wp-content/uploads/IRBM-e-Invoice-Specific-Guideline.pdf"

          download_pdf "Garis-Panduan-e-Invois-LHDNM.pdf" \
            "https://www.hasil.gov.my/wp-content/uploads/Garis-Panduan-e-Invois-LHDNM.pdf"

          download_pdf "LHDN-Garis-Panduan-Spesifik-e-Invois.pdf" \
            "https://www.hasil.gov.my/wp-content/uploads/LHDN-Garis-Panduan-Spesifik-e-Invois.pdf"

          echo "CHANGED_LIST=$CHANGED_LIST" >> "$GITHUB_ENV"

      - name: Generate status file
        run: |
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          python3 << 'PYEOF'
          import json, os, hashlib, datetime

          now = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
          status_file = 'pdfs/pdf-status.json'
          old_status = {}

          if os.path.exists(status_file):
              with open(status_file) as f:
                  try:
                      old_status = json.load(f)
                  except:
                      pass

          pdfs = {
              'IRBM-e-Invoice-Guideline.pdf': 'https://www.hasil.gov.my/wp-content/uploads/IRBM-e-Invoice-Guideline.pdf',
              'IRBM-e-Invoice-Specific-Guideline.pdf': 'https://www.hasil.gov.my/wp-content/uploads/IRBM-e-Invoice-Specific-Guideline.pdf',
              'Garis-Panduan-e-Invois-LHDNM.pdf': 'https://www.hasil.gov.my/wp-content/uploads/Garis-Panduan-e-Invois-LHDNM.pdf',
              'LHDN-Garis-Panduan-Spesifik-e-Invois.pdf': 'https://www.hasil.gov.my/wp-content/uploads/LHDN-Garis-Panduan-Spesifik-e-Invois.pdf',
          }

          new_status = {}
          for filename, url in pdfs.items():
              path = f'pdfs/{filename}'
              if not os.path.exists(path):
                  continue

              size = os.path.getsize(path)
              sha = hashlib.sha256(open(path, 'rb').read()).hexdigest()

              old = old_status.get(filename, {})
              old_sha = old.get('sha256', '')
              old_updated = old.get('updated', now)

              updated = now if sha != old_sha else old_updated

              new_status[filename] = {
                  'url': url,
                  'size_bytes': size,
                  'sha256': sha,
                  'last_checked': now,
                  'updated': updated,
              }

          with open(status_file, 'w') as f:
              json.dump(new_status, f, indent=2)

          print(f'Status written for {len(new_status)} PDFs')
          PYEOF

      - name: Commit changes
        run: |
          git add pdfs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            if [ -n "$CHANGED_LIST" ]; then
              NAMES=$(echo "$CHANGED_LIST" | xargs -n1 | sort | paste -sd ', ')
              git commit -m "Update LHDN PDFs - $(date +'%d %b %Y') - $NAMES"
            else
              git commit -m "PDF status check - $(date +'%d %b %Y') - no content changes"
            fi
            git push
          fi
