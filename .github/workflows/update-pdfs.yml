name: Update LHDN PDFs

on:
  schedule:
    # Every Monday at 8am MYT (midnight UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create pdfs directory
        run: mkdir -p pdfs

      - name: Download PDFs
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

          declare -A PDFS
          PDFS[IRBM-e-Invoice-Guideline.pdf]="https://www.hasil.gov.my/wp-content/uploads/IRBM-e-Invoice-Guideline.pdf"
          PDFS[IRBM-e-Invoice-Specific-Guideline.pdf]="https://www.hasil.gov.my/wp-content/uploads/IRBM-e-Invoice-Specific-Guideline.pdf"
          PDFS[Garis-Panduan-e-Invois-LHDNM.pdf]="https://www.hasil.gov.my/wp-content/uploads/Garis-Panduan-e-Invois-LHDNM.pdf"
          PDFS[LHDN-Garis-Panduan-Spesifik-e-Invois.pdf]="https://www.hasil.gov.my/wp-content/uploads/LHDN-Garis-Panduan-Spesifik-e-Invois.pdf"

          for filename in "${!PDFS[@]}"; do
            url="${PDFS[$filename]}"
            echo "Downloading $filename..."
            curl -L -A "$UA" \
              -H "Accept: application/pdf,*/*" \
              -H "Accept-Language: en-US,en;q=0.9" \
              --retry 3 --retry-delay 5 \
              -o "pdfs/$filename" \
              "$url"

            # Validate: real PDFs start with %PDF and should be > 100KB
            SIZE=$(stat -c%s "pdfs/$filename")
            HEADER=$(head -c 5 "pdfs/$filename")
            echo "  -> Size: ${SIZE} bytes, Header: ${HEADER}"

            if [ "$SIZE" -lt 100000 ]; then
              echo "  ⚠️  WARNING: $filename is only ${SIZE} bytes - probably not a real PDF"
              echo "  First 200 chars of downloaded file:"
              head -c 200 "pdfs/$filename"
              echo ""
              # Remove the bad file so we don't commit garbage
              rm "pdfs/$filename"
              echo "  Removed bad download."
            elif [ "$HEADER" != "%PDF-" ]; then
              echo "  ⚠️  WARNING: $filename doesn't start with %PDF header"
              rm "pdfs/$filename"
              echo "  Removed bad download."
            else
              echo "  ✅ Valid PDF"
            fi
            echo ""
          done

      - name: Check for changes and commit
        run: |
          git add pdfs/
          if git diff --cached --quiet; then
            echo "No PDF changes detected"
          else
            CHANGED=$(git diff --cached --name-only | xargs -I{} basename {} | paste -sd ', ')
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update LHDN PDFs - $(date +'%d %b %Y') - ${CHANGED}"
            git push
          fi
